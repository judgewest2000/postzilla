<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="../monaco/vs/editor/editor.main.css" />
    <style>
        html, body, #container { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #placeholder {
            position: absolute; top: 0; pointer-events: none; white-space: pre; display: none;
            font-family: 'Cascadia Mono', Consolas, monospace; font-size: 13px; line-height: 19px; color: #9d9d9d;
        }
        body.light #placeholder { color: #6e6e6e; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="placeholder"></div>
    <script src="../monaco/vs/loader.js"></script>
    <script src="editor.js"></script>
</body>
</html>
